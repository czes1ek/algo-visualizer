name: Web demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 3.1.74
      - name: Build WebAssembly
        run: |
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DALGOVIZ_WARNINGS_AS_ERRORS=ON
          cmake --build build-web
      - name: Assemble site
        run: |
          mkdir -p site
          cp web/index.html web/style.css web/app.js build-web/algoviz.js build-web/algoviz.wasm site/
          du -ch site/* | tail -1
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
